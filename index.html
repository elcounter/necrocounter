<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#32363c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NecroCounter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bitter:wght@400;600;700&display=swap">
  <style>
    :root {
      --bg: #2a2c30;
      --bg-2: #32353a;
      --panel: #3a3e44;
      --panel-2: #454a51;
      --line: #5c636c;
      --text: #eef1f4;
      --muted: #a8b0ba;
      --amber: #f0b040;
      --amber-dim: #d47820;
      --danger: #b04434;
      --bar: #32363c;
      --navh: 58px;
      --display: "Oswald", system-ui, sans-serif;
      --body: "Bitter", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 400 16px/1.45 var(--body); min-height: 100%; }
    body { padding-bottom: calc(var(--navh) + env(safe-area-inset-bottom, 0px)); }
    a { color: var(--amber); }
    .bar {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(180deg, #3c4148 0%, var(--bar) 100%);
      border-bottom: 2px solid var(--amber);
      box-shadow: 0 2px 12px rgba(0,0,0,.28);
    }
    .bar .in {
      display: flex; align-items: center; gap: 10px;
      max-width: 820px; margin: 0 auto;
      padding: 12px 16px calc(12px + env(safe-area-inset-top, 0px));
    }
    .bar h1 {
      flex: 1; margin: 0; min-width: 0;
      font: 700 22px/1.1 var(--display); letter-spacing: .08em;
      text-transform: uppercase; color: var(--amber);
      text-shadow: 0 0 18px rgba(232,160,32,.25);
    }
    .back {
      flex: none; width: 40px; height: 40px; border: 0; border-radius: 10px;
      background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer;
    }
    .back:active { background: rgba(232,160,32,.12); }
    .back[hidden] { display: none; }
    .hm {
      flex: none; width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center; color: var(--text); text-decoration: none;
    }
    .hm:active { background: rgba(240,176,64,.12); }
    .hm svg { width: 22px; height: 22px; }
    .hm[hidden] { display: none; }
    main.in { max-width: 820px; margin: 0 auto; padding: 18px 16px 28px; }
    .welcome { text-align: center; padding: 18px 8px 8px; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 12px; display: block;
      filter: drop-shadow(0 0 12px rgba(232,160,32,.35));
    }
    .welcome h2 {
      margin: 0 0 6px; font: 700 26px/1.15 var(--display);
      letter-spacing: .06em; text-transform: uppercase; color: var(--text);
    }
    .welcome p { margin: 0; color: var(--muted); }
    .feat { display: grid; gap: 10px; margin-top: 22px; }
    .fcard {
      display: flex; gap: 14px; align-items: center;
      padding: 14px 16px; border-radius: 12px;
      background: linear-gradient(145deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      text-decoration: none; color: inherit;
      box-shadow: inset 0 1px 0 rgba(240,176,64,.12), 0 4px 14px rgba(0,0,0,.18);
    }
    .fcard:active { border-color: var(--amber-dim); }
    .ficon {
      flex: none; width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle at 30% 30%, #5a6068, #353a40);
      border: 1px solid var(--amber-dim); color: var(--amber);
    }
    .ficon svg { width: 22px; height: 22px; }
    .fcard b { font: 700 16px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--amber); }
    .fcard span span { color: var(--muted); font-size: 14px; }
    .home-extra { display: flex; flex-direction: column; gap: 10px; margin: 22px 0 8px; }
    .btn-link {
      display: block; text-align: center; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 10px;
      background: rgba(0,0,0,.12); color: var(--amber);
      font: 600 14px var(--display); text-decoration: none; letter-spacing: .04em;
    }
    .btn-link:active { background: rgba(232,160,32,.1); }
    .copy {
      margin: 28px 0 0; text-align: center;
      font: 400 11px/1.4 var(--body); color: #8a929c; letter-spacing: .03em;
    }
    .copy .legal { display: inline-block; margin-top: 3px; font-size: 9px; line-height: 1.3; color: #7a828c; }
    .page h2 {
      margin: 0 0 10px; font: 700 22px/1.2 var(--display);
      letter-spacing: .05em; text-transform: uppercase; color: var(--amber);
    }
    .page p { color: var(--muted); }
    .panel {
      margin-top: 16px; border-radius: 12px; overflow: hidden;
      border: 1px solid var(--line); background: var(--panel);
    }
    .panel .sec {
      margin: 0; padding: 10px 14px;
      background: linear-gradient(90deg, #6a5228, #4a3a1c);
      color: var(--amber); font: 700 13px/1.2 var(--display);
      letter-spacing: .08em; text-transform: uppercase;
    }
    .panel .body { padding: 14px; }
    .btn {
      display: inline-block; width: 100%; text-align: center;
      padding: 12px 16px; border-radius: 10px; border: 0;
      font: 700 15px/1.2 var(--display); letter-spacing: .05em; text-transform: uppercase;
      text-decoration: none; cursor: pointer;
    }
    .btn.primary { background: linear-gradient(180deg, #e8a020, #c45c12); color: #2a1c14; }
    .btn.primary:active { filter: brightness(1.05); }
    .bnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
      background: #26292e; border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -2px 12px rgba(0,0,0,.4);
    }
    .bnav .in {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      max-width: 820px; margin: 0 auto;
    }
    .bnav a {
      display: grid; justify-items: center; gap: 3px;
      padding: 8px 2px 9px; text-decoration: none; color: var(--muted);
      font: 500 11px var(--display); text-transform: uppercase; letter-spacing: .06em;
      border-top: 3px solid transparent; margin-top: -1px;
    }
    .bnav a[aria-current="page"] { color: var(--amber); border-top-color: var(--amber); }
    .bnav svg { width: 22px; height: 22px; }
    .placeholder {
      margin-top: 12px; padding: 16px; border-radius: 12px;
      border: 1px dashed var(--line); color: var(--muted); text-align: center;
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="in top">
      <button class="back" id="back" type="button" aria-label="Retour" hidden>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="title">NecroCounter</h1>
      <a class="hm" id="home-btn" href="#accueil" aria-label="Accueil" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      </a>
    </div>
  </header>

  <main class="in">
    <div id="view"></div>
    <p class="copy">
      © 2026 elcounter<br>
      NecroCounter version 0.1.6 · Necromunda N23 · MAJ 05-11-2026<br>
      <span class="legal">Application non officielle, non affiliée à Games Workshop. Necromunda est une marque de Games Workshop Ltd.</span>
    </p>
  </main>

  <nav class="bnav" aria-label="Navigation principale">
    <div class="in">
      <a href="#accueil" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        <span>Accueil</span>
      </a>
      <a href="#gangs" id="nav-gangs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Gangs</span>
      </a>
      <a href="#partie" id="nav-partie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg>
        <span>Partie</span>
      </a>
      <a href="#regles" id="nav-regles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/></svg>
        <span>Règles</span>
      </a>
    </div>
  </nav>

  <script>
  (function () {
    "use strict";
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const I = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

    const FEATURES = [
      ["gangs", "Gangs", "Crée et gère tes gangs et tes combattants.", '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 0v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'],
      ["partie", "Partie", "Suis une partie en cours dans l'underhive.", '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/>'],
      ["regles", "Règles", "Rappels de règles et aides de jeu.", '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/>']
    ];

    function homeHtml() {
      return `<div class="welcome">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#32363c"/>
          <circle cx="32" cy="32" r="25" fill="none" stroke="#e8a020" stroke-width="2.5"/>
          <path d="M22 20v24M42 20v24M22 20l20 24" fill="none" stroke="#e8a020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2>NecroCounter</h2>
        <p>Ton compagnon pour Necromunda N23.</p>
      </div>
      <div class="feat">${FEATURES.map(([id, n, d, svg]) =>
        `<a class="fcard" href="#${id}"><span class="ficon">${I(svg)}</span><span><b>${n}</b><br><span>${d}</span></span></a>`
      ).join("")}</div>
      <div class="home-extra">
        <a class="btn-link" href="mailto:warcounter@proton.me?subject=%5BNecroCounter%5D%20Retour">Signaler un bug / Suggestion</a>
        <a class="btn-link" href="#soutenir">Soutenir le projet</a>
      </div>`;
    }

    function placeholder(title, text) {
      return `<div class="page"><h2>${esc(title)}</h2><p>${esc(text)}</p>
        <div class="placeholder">Section en construction — prochaines versions.</div></div>`;
    }

    function supportHtml() {
      return `<div class="page">
        <h2>Soutenir le projet</h2>
        <p>Projet piloté sur mon temps libre. Ton don servira à payer un meilleur hébergement et à me donner du temps pour peaufiner l'application.</p>
        <p>NecroCounter est gratuit, sans publicité, et le restera.</p>
        <div class="panel"><h3 class="sec">Faire un don</h3><div class="body">
          <a class="btn primary" href="https://www.paypal.com/qrcodes/p2pqrc/MXBPC6EUBZBGN" target="_blank" rel="noopener">Faire un don avec PayPal</a>
        </div></div>
      </div>`;
    }

    function route() {
      const h = location.hash.slice(1) || "accueil";
      const back = $("back");
      const title = $("title");
      const view = $("view");

      const tabs = { accueil: "nav-home", gangs: "nav-gangs", partie: "nav-partie", regles: "nav-regles" };
      Object.values(tabs).forEach(id => { const el = $(id); if (el) el.removeAttribute("aria-current"); });
      if (tabs[h]) $(tabs[h]).setAttribute("aria-current", "page");

      back.hidden = !(h === "soutenir");
      const homeBtn = $("home-btn");
      if (homeBtn) homeBtn.hidden = (h === "accueil" || h === "");
      if (h === "gangs") {
        title.textContent = "Gangs";
        view.innerHTML = placeholder("Gangs", "Crée tes gangs, gère tes combattants et leur équipement.");
      } else if (h === "partie") {
        title.textContent = "Partie";
        view.innerHTML = placeholder("Partie", "Suivi de partie : blessures, status, priorités.");
      } else if (h === "regles") {
        title.textContent = "Règles";
        view.innerHTML = placeholder("Règles", "Aides de jeu et rappels pour la table.");
      } else if (h === "soutenir") {
        title.textContent = "Soutenir";
        view.innerHTML = supportHtml();
      } else {
        title.textContent = "NecroCounter";
        view.innerHTML = homeHtml();
      }
      window.scrollTo(0, 0);
    }

    $("back").addEventListener("click", () => { location.hash = "accueil"; });
    window.addEventListener("hashchange", route);
    route();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  })();
  </script>
<script data-goatcounter="https://necrocounter.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
