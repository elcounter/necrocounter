<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#32363c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NecroCounter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bitter:wght@400;600;700&display=swap">
  <style>
    :root {
      --bg: #2a2c30;
      --bg-2: #32353a;
      --panel: #3a3e44;
      --panel-2: #454a51;
      --line: #5c636c;
      --text: #eef1f4;
      --muted: #a8b0ba;
      --amber: #f0b040;
      --amber-dim: #d47820;
      --danger: #b04434;
      --ok: #3d8b5c;
      --bar: #32363c;
      --navh: 58px;
      --display: "Oswald", system-ui, sans-serif;
      --body: "Bitter", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 400 16px/1.45 var(--body); min-height: 100%; }
    body { padding-bottom: calc(var(--navh) + env(safe-area-inset-bottom, 0px)); }
    a { color: var(--amber); }
    .bar {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(180deg, #3c4148 0%, var(--bar) 100%);
      border-bottom: 2px solid var(--amber);
      box-shadow: 0 2px 12px rgba(0,0,0,.28);
    }
    .bar .in {
      display: flex; align-items: center; gap: 10px;
      max-width: 820px; margin: 0 auto;
      padding: 12px 16px calc(12px + env(safe-area-inset-top, 0px));
    }
    .bar h1 {
      flex: 1; margin: 0; min-width: 0;
      font: 700 22px/1.1 var(--display); letter-spacing: .08em;
      text-transform: uppercase; color: var(--amber);
      text-shadow: 0 0 18px rgba(232,160,32,.25);
    }
    .back {
      flex: none; width: 40px; height: 40px; border: 0; border-radius: 10px;
      background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer;
    }
    .back:active { background: rgba(232,160,32,.12); }
    .back[hidden] { display: none; }
    .hm {
      flex: none; width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center; color: var(--text); text-decoration: none;
    }
    .hm:active { background: rgba(240,176,64,.12); }
    .hm svg { width: 22px; height: 22px; }
    .hm[hidden] { display: none; }
    main.in { max-width: 820px; margin: 0 auto; padding: 18px 16px 28px; }
    .welcome { text-align: center; padding: 18px 8px 8px; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 12px; display: block;
      filter: drop-shadow(0 0 12px rgba(232,160,32,.35));
    }
    .welcome h2 {
      margin: 0 0 6px; font: 700 26px/1.15 var(--display);
      letter-spacing: .06em; text-transform: uppercase; color: var(--text);
    }
    .welcome p { margin: 0; color: var(--muted); }
    .feat { display: grid; gap: 10px; margin-top: 22px; }
    .fcard {
      display: flex; gap: 14px; align-items: center;
      padding: 14px 16px; border-radius: 12px;
      background: linear-gradient(145deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      text-decoration: none; color: inherit;
      box-shadow: inset 0 1px 0 rgba(240,176,64,.12), 0 4px 14px rgba(0,0,0,.18);
    }
    .fcard:active { border-color: var(--amber-dim); }
    .ficon {
      flex: none; width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle at 30% 30%, #5a6068, #353a40);
      border: 1px solid var(--amber-dim); color: var(--amber);
    }
    .ficon svg { width: 22px; height: 22px; }
    .fcard b { font: 700 16px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--amber); }
    .fcard span span { color: var(--muted); font-size: 14px; }
    .home-extra { display: flex; flex-direction: column; gap: 10px; margin: 22px 0 8px; }
    .btn-link {
      display: block; text-align: center; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: 10px;
      background: rgba(0,0,0,.12); color: var(--amber);
      font: 600 14px var(--display); text-decoration: none; letter-spacing: .04em;
    }
    .btn-link:active { background: rgba(232,160,32,.1); }
    .copy {
      margin: 28px 0 0; text-align: center;
      font: 400 11px/1.4 var(--body); color: #8a929c; letter-spacing: .03em;
    }
    .copy .legal { display: inline-block; margin-top: 3px; font-size: 9px; line-height: 1.3; color: #7a828c; }
    .page h2 {
      margin: 0 0 10px; font: 700 22px/1.2 var(--display);
      letter-spacing: .05em; text-transform: uppercase; color: var(--amber);
    }
    .page p { color: var(--muted); }
    .panel {
      margin-top: 14px; border-radius: 12px; overflow: hidden;
      border: 1px solid var(--line); background: var(--panel);
    }
    .panel .sec {
      margin: 0; padding: 10px 14px;
      background: linear-gradient(90deg, #6a5228, #4a3a1c);
      color: var(--amber); font: 700 13px/1.2 var(--display);
      letter-spacing: .08em; text-transform: uppercase;
    }
    .panel .body { padding: 14px; }
    .btn {
      display: inline-block; width: 100%; text-align: center;
      padding: 12px 16px; border-radius: 10px; border: 0;
      font: 700 15px/1.2 var(--display); letter-spacing: .05em; text-transform: uppercase;
      text-decoration: none; cursor: pointer; color: #2a1c14;
    }
    .btn.primary { background: linear-gradient(180deg, #f0b040, #d47820); }
    .btn.ghost {
      background: transparent; color: var(--amber); border: 1px solid var(--line);
    }
    .btn.danger { background: linear-gradient(180deg, #c45a48, #8b2e1f); color: #fff; }
    .btn.small { width: auto; padding: 8px 12px; font-size: 12px; }
    .btn + .btn { margin-top: 8px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-row .btn { width: auto; flex: 1 1 auto; margin-top: 0; }
    .fld { display: block; margin-bottom: 12px; }
    .fld span { display: block; margin-bottom: 4px; font: 600 12px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .fld input, .fld select, .fld textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
      font: 400 15px var(--body);
    }
    .fld textarea { min-height: 80px; resize: vertical; }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; }
    .seg button {
      flex: 1 1 auto; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--muted);
      font: 600 13px var(--display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
    }
    .seg button.on { background: var(--amber); color: #2a1c14; border-color: var(--amber); }
    .crew-list { display: grid; gap: 8px; }
    .crew-row {
      display: grid; grid-template-columns: 1fr 72px 36px; gap: 8px; align-items: center;
    }
    .crew-row input {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
      font: 400 14px var(--body);
    }
    .icon-x {
      border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; padding: 6px;
    }
    .live-top {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 12px; padding: 12px; border-radius: 12px;
      background: var(--panel); border: 1px solid var(--line);
    }
    .live-top .pill {
      font: 700 13px var(--display); letter-spacing: .05em; text-transform: uppercase;
      padding: 6px 10px; border-radius: 999px; background: var(--bg); color: var(--amber);
    }
    .fighter {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      background: var(--panel); margin-bottom: 8px;
    }
    .fighter.ooa { opacity: .55; }
    .fighter .fname {
      display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
      font: 700 15px var(--display); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 8px;
    }
    .fighter .fname small { color: var(--muted); font: 400 12px var(--body); text-transform: none; letter-spacing: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .tag {
      font: 600 11px var(--display); letter-spacing: .04em; text-transform: uppercase;
      padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); cursor: pointer;
      background: var(--bg);
    }
    .tag.on { background: var(--amber); color: #2a1c14; border-color: var(--amber); }
    .tag.danger.on { background: var(--danger); color: #fff; border-color: var(--danger); }
    .wounds { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .wounds button {
      width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); font-size: 18px; cursor: pointer;
    }
    .wounds b { min-width: 3ch; text-align: center; font: 700 16px var(--display); }
    .ready-btn {
      width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--bg); color: var(--muted); font: 700 12px var(--display);
      letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
    }
    .ready-btn.on { background: var(--ok); color: #fff; border-color: var(--ok); }
    .gang-col { margin-bottom: 16px; }
    .gang-col h3 {
      margin: 0 0 8px; font: 700 14px var(--display); letter-spacing: .08em;
      text-transform: uppercase; color: var(--amber);
    }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
    .placeholder {
      margin-top: 12px; padding: 16px; border-radius: 12px;
      border: 1px dashed var(--line); color: var(--muted); text-align: center;
    }
    .history { display: grid; gap: 8px; margin-top: 12px; }
    .history a {
      display: block; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--panel); text-decoration: none; color: inherit;
    }
    .history a b { color: var(--amber); font: 700 14px var(--display); letter-spacing: .04em; }
    .history a span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
    .bnav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
      background: #26292e; border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -2px 12px rgba(0,0,0,.4);
    }
    .bnav .in {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      max-width: 820px; margin: 0 auto;
    }
    .bnav a {
      display: grid; justify-items: center; gap: 3px;
      padding: 8px 2px 9px; text-decoration: none; color: var(--muted);
      font: 500 11px var(--display); text-transform: uppercase; letter-spacing: .06em;
      border-top: 3px solid transparent; margin-top: -1px;
    }
    .bnav a[aria-current="page"] { color: var(--amber); border-top-color: var(--amber); }
    .bnav svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <header class="bar">
    <div class="in top">
      <button class="back" id="back" type="button" aria-label="Retour" hidden>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="title">NecroCounter</h1>
      <a class="hm" id="home-btn" href="#accueil" aria-label="Accueil" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      </a>
    </div>
  </header>

  <main class="in">
    <div id="view"></div>
    <p class="copy">
      © 2026 elcounter<br>
      NecroCounter version 0.2.0 · MAJ 07-11-2026<br>
      <span class="legal">Application non officielle, non affiliée à Games Workshop. Necromunda est une marque de Games Workshop Ltd.</span>
    </p>
  </main>

  <nav class="bnav" aria-label="Navigation principale">
    <div class="in">
      <a href="#accueil" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        <span>Accueil</span>
      </a>
      <a href="#gangs" id="nav-gangs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 0v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Gangs</span>
      </a>
      <a href="#partie" id="nav-partie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg>
        <span>Partie</span>
      </a>
      <a href="#regles" id="nav-regles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/></svg>
        <span>Règles</span>
      </a>
    </div>
  </nav>

  <script>
  (function () {
    "use strict";
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const I = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const uid = () => Math.random().toString(36).slice(2, 10);
    const STORE = "nc_match_v1";
    const HIST = "nc_match_history_v1";

    const FEATURES = [
      ["gangs", "Gangs", "Crée et gère tes gangs et tes combattants.", '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 0v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'],
      ["partie", "Partie", "Suis une partie en cours dans l'underhive.", '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/>'],
      ["regles", "Règles", "Rappels de règles et aides de jeu.", '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/>']
    ];

    const STATUSES = [
      { id: "fw", label: "Flesh Wound" },
      { id: "si", label: "Serious Injury" },
      { id: "ooa", label: "Out of Action", danger: true },
      { id: "blaze", label: "Blaze" },
      { id: "pinned", label: "Pinned" },
      { id: "broken", label: "Broken" }
    ];

    let match = null;
    let setupDraft = null;

    function loadMatch() {
      try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { return null; }
    }
    function saveMatch() {
      if (match) localStorage.setItem(STORE, JSON.stringify(match));
      else localStorage.removeItem(STORE);
    }
    function loadHist() {
      try { return JSON.parse(localStorage.getItem(HIST) || "[]"); } catch (e) { return []; }
    }
    function pushHist(m) {
      const h = loadHist();
      h.unshift({
        id: m.id, format: m.format, edition: m.edition,
        a: m.gangs[0].name, b: m.gangs[1].name,
        winner: (m.post && m.post.winner) || "",
        at: m.endedAt || m.createdAt
      });
      localStorage.setItem(HIST, JSON.stringify(h.slice(0, 20)));
    }

    function fighter(name, cost) {
      return { id: uid(), name: name || "Combattant", cost: cost || 0, wounds: 1, maxWounds: 1, ready: true, status: [] };
    }
    function emptyGang(label) {
      return { name: label, rating: "", crew: [fighter(label === "Gang A" ? "Leader A" : "Leader B", 0)] };
    }
    function newDraft() {
      return {
        format: "skirmish",
        edition: "N26",
        budget: "1000",
        budgetCustom: "",
        gangs: [emptyGang("Gang A"), emptyGang("Gang B")]
      };
    }

    function homeHtml() {
      return `<div class="welcome">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#32363c"/>
          <circle cx="32" cy="32" r="25" fill="none" stroke="#f0b040" stroke-width="2.5"/>
          <path d="M22 20v24M42 20v24M22 20l20 24" fill="none" stroke="#f0b040" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2>NecroCounter</h2>
        <p>Ton compagnon pour Necromunda.</p>
      </div>
      <div class="feat">${FEATURES.map(([id, n, d, svg]) =>
        `<a class="fcard" href="#${id}"><span class="ficon">${I(svg)}</span><span><b>${n}</b><br><span>${d}</span></span></a>`
      ).join("")}</div>
      <div class="home-extra">
        <a class="btn-link" href="mailto:warcounter@proton.me?subject=%5BNecroCounter%5D%20Retour">Signaler un bug / Suggestion</a>
        <a class="btn-link" href="#soutenir">Soutenir le projet</a>
      </div>`;
    }

    function placeholder(title, text) {
      return `<div class="page"><h2>${esc(title)}</h2><p>${esc(text)}</p>
        <div class="placeholder">Section en construction — prochaines versions.</div></div>`;
    }

    function supportHtml() {
      return `<div class="page">
        <h2>Soutenir le projet</h2>
        <p>Projet piloté sur mon temps libre. Ton don servira à payer un meilleur hébergement et à me donner du temps pour peaufiner l'application.</p>
        <p>NecroCounter est gratuit, sans publicité, et le restera.</p>
        <div class="panel"><h3 class="sec">Faire un don</h3><div class="body">
          <a class="btn primary" href="https://www.paypal.com/qrcodes/p2pqrc/MXBPC6EUBZBGN" target="_blank" rel="noopener">Faire un don avec PayPal</a>
        </div></div>
      </div>`;
    }

    function seg(name, options, current) {
      return `<div class="seg" data-seg="${name}">${options.map(([v, lab]) =>
        `<button type="button" data-v="${v}" class="${current === v ? "on" : ""}">${lab}</button>`
      ).join("")}</div>`;
    }

    function crewEditor(gi, g) {
      return `<div class="panel"><h3 class="sec">${esc(g.name || ("Gang " + (gi + 1)))}</h3><div class="body">
        <label class="fld"><span>Nom du gang</span><input data-g="${gi}" data-k="name" value="${esc(g.name)}"></label>
        <label class="fld"><span>Rating (optionnel)</span><input data-g="${gi}" data-k="rating" inputmode="numeric" value="${esc(g.rating)}"></label>
        <p class="hint">Crew (saisie libre)</p>
        <div class="crew-list" id="crew-${gi}">
          ${g.crew.map((f, fi) => `<div class="crew-row">
            <input data-g="${gi}" data-f="${fi}" data-k="name" value="${esc(f.name)}" placeholder="Nom">
            <input data-g="${gi}" data-f="${fi}" data-k="cost" inputmode="numeric" value="${f.cost || ""}" placeholder="Cr">
            <button type="button" class="icon-x" data-del-f="${gi}:${fi}" aria-label="Retirer">×</button>
          </div>`).join("")}
        </div>
        <div class="btn-row" style="margin-top:10px">
          <button type="button" class="btn ghost small" data-add-f="${gi}">+ Combattant</button>
        </div>
      </div></div>`;
    }

    function setupHtml() {
      const d = setupDraft || newDraft();
      setupDraft = d;
      const hist = loadHist();
      return `<div class="page">
        <h2>Nouvelle partie</h2>
        <p class="hint">Setup libre — N23 / N26 · escarmouche ou campagne.</p>
        <div class="panel"><h3 class="sec">Format</h3><div class="body">
          <label class="fld"><span>Type</span>${seg("format", [["skirmish","Escarmouche"],["campaign","Campagne"]], d.format)}</label>
          <label class="fld"><span>Édition</span>${seg("edition", [["N26","N26"],["N23","N23"]], d.edition)}</label>
          <label class="fld"><span>Budget crédits</span>${seg("budget", [["800","800"],["1000","1000"],["1250","1250"],["1500","1500"],["libre","Libre"]], d.budget)}</label>
          <label class="fld" id="budget-custom-wrap" ${d.budget === "libre" ? "" : "hidden"}><span>Budget libre</span><input id="budget-custom" inputmode="numeric" value="${esc(d.budgetCustom)}" placeholder="ex. 1100"></label>
        </div></div>
        ${crewEditor(0, d.gangs[0])}
        ${crewEditor(1, d.gangs[1])}
        <button type="button" class="btn primary" id="start-match">Lancer la partie</button>
        ${match && match.phase !== "done" ? `<button type="button" class="btn ghost" id="resume-match">Reprendre la partie en cours</button>` : ""}
        ${hist.length ? `<div class="panel"><h3 class="sec">Historique local</h3><div class="body history">
          ${hist.slice(0, 5).map(h => `<div><b>${esc(h.a)} vs ${esc(h.b)}</b><span>${esc(h.format)} · ${esc(h.edition)}${h.winner ? " · " + esc(h.winner) : ""}</span></div>`).join("")}
        </div></div>` : ""}
      </div>`;
    }

    function bindSetup() {
      const d = setupDraft;
      $("view").querySelectorAll("[data-seg]").forEach(box => {
        box.addEventListener("click", e => {
          const btn = e.target.closest("button[data-v]");
          if (!btn) return;
          const key = box.getAttribute("data-seg");
          d[key] = btn.getAttribute("data-v");
          box.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
          const wrap = $("budget-custom-wrap");
          if (wrap) wrap.hidden = d.budget !== "libre";
        });
      });
      $("view").querySelectorAll("input[data-g]").forEach(inp => {
        inp.addEventListener("input", () => {
          const gi = +inp.getAttribute("data-g");
          const fi = inp.getAttribute("data-f");
          const k = inp.getAttribute("data-k");
          if (fi == null) d.gangs[gi][k] = inp.value;
          else {
            const v = k === "cost" ? (parseInt(inp.value, 10) || 0) : inp.value;
            d.gangs[gi].crew[+fi][k] = v;
          }
        });
      });
      $("view").querySelectorAll("[data-add-f]").forEach(btn => {
        btn.addEventListener("click", () => {
          const gi = +btn.getAttribute("data-add-f");
          d.gangs[gi].crew.push(fighter("Combattant", 0));
          renderPartie();
        });
      });
      $("view").querySelectorAll("[data-del-f]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [gi, fi] = btn.getAttribute("data-del-f").split(":").map(Number);
          if (d.gangs[gi].crew.length < 2) return;
          d.gangs[gi].crew.splice(fi, 1);
          renderPartie();
        });
      });
      const start = $("start-match");
      if (start) start.addEventListener("click", () => {
        const custom = ($("budget-custom") || {}).value || "";
        d.budgetCustom = custom;
        match = {
          id: uid(),
          format: d.format,
          edition: d.edition,
          budget: d.budget === "libre" ? (custom || "libre") : d.budget,
          phase: "live",
          round: 1,
          priority: 0,
          gangs: d.gangs.map(g => ({
            name: g.name || "Gang",
            rating: g.rating || "",
            crew: g.crew.map(f => ({
              id: f.id || uid(),
              name: f.name || "Combattant",
              cost: f.cost || 0,
              wounds: 1,
              maxWounds: 1,
              ready: true,
              status: []
            }))
          })),
          post: { winner: "", sideJobA: false, sideJobB: false, creditsA: "", creditsB: "", notes: "" },
          createdAt: new Date().toISOString()
        };
        setupDraft = null;
        saveMatch();
        renderPartie();
      });
      const resume = $("resume-match");
      if (resume) resume.addEventListener("click", () => { match = loadMatch(); renderPartie(); });
    }

    function fighterCard(gi, fi, f) {
      const ooa = f.status.includes("ooa");
      return `<div class="fighter ${ooa ? "ooa" : ""}" data-gi="${gi}" data-fi="${fi}">
        <div class="fname"><span>${esc(f.name)}</span><small>${f.cost ? f.cost + " cr" : ""}</small></div>
        <div class="wounds">
          <button type="button" data-w="-">−</button>
          <b>${f.wounds}</b>
          <button type="button" data-w="+">+</button>
          <span class="hint" style="margin:0">Blessures</span>
        </div>
        <div class="tags">
          ${STATUSES.map(s => `<button type="button" class="tag ${s.danger ? "danger " : ""}${f.status.includes(s.id) ? "on" : ""}" data-st="${s.id}">${s.label}</button>`).join("")}
        </div>
        <button type="button" class="ready-btn ${f.ready && !ooa ? "on" : ""}" data-ready>${f.ready && !ooa ? "Ready" : "Activé / indispo"}</button>
      </div>`;
    }

    function liveHtml() {
      const m = match;
      return `<div class="page">
        <h2>Partie live</h2>
        <div class="live-top">
          <span class="pill">${esc(m.edition)} · ${m.format === "campaign" ? "Campagne" : "Escarmouche"}</span>
          <span class="pill">Budget ${esc(String(m.budget))}</span>
          <span class="pill">Round ${m.round}</span>
          <span class="pill">Priorité : ${esc(m.gangs[m.priority].name)}</span>
        </div>
        <div class="btn-row">
          <button type="button" class="btn ghost small" id="tog-priority">Changer priorité</button>
          <button type="button" class="btn ghost small" id="next-round">Round +1</button>
          <button type="button" class="btn ghost small" id="reset-ready">Reset Ready</button>
        </div>
        ${m.gangs.map((g, gi) => `<div class="gang-col">
          <h3>${esc(g.name)}${g.rating ? " · " + esc(g.rating) : ""}</h3>
          ${g.crew.map((f, fi) => fighterCard(gi, fi, f)).join("")}
        </div>`).join("")}
        <div class="panel"><h3 class="sec">Bottle / moral</h3><div class="body">
          <p class="hint">Rappel : teste le bottle quand tu perds assez de combattants (selon scénario / édition). Note le résultat ici si besoin.</p>
          <label class="fld"><span>Note bottle</span><input id="bottle-note" value="${esc(m.bottleNote || "")}" placeholder="ex. Gang A bottle au round 3"></label>
        </div></div>
        <button type="button" class="btn primary" id="to-post">Passer au post-battle</button>
        <button type="button" class="btn danger" id="abort-match">Abandonner la partie</button>
      </div>`;
    }

    function bindLive() {
      const m = match;
      $("tog-priority").addEventListener("click", () => { m.priority = m.priority ? 0 : 1; saveMatch(); renderPartie(); });
      $("next-round").addEventListener("click", () => { m.round += 1; m.gangs.forEach(g => g.crew.forEach(f => { if (!f.status.includes("ooa")) f.ready = true; })); saveMatch(); renderPartie(); });
      $("reset-ready").addEventListener("click", () => { m.gangs.forEach(g => g.crew.forEach(f => { if (!f.status.includes("ooa")) f.ready = true; })); saveMatch(); renderPartie(); });
      const bottle = $("bottle-note");
      if (bottle) bottle.addEventListener("input", () => { m.bottleNote = bottle.value; saveMatch(); });
      $("view").querySelectorAll(".fighter").forEach(card => {
        const gi = +card.getAttribute("data-gi");
        const fi = +card.getAttribute("data-fi");
        const f = m.gangs[gi].crew[fi];
        card.querySelectorAll("[data-w]").forEach(btn => {
          btn.addEventListener("click", () => {
            f.wounds = Math.max(0, f.wounds + (btn.getAttribute("data-w") === "+" ? 1 : -1));
            saveMatch(); renderPartie();
          });
        });
        card.querySelectorAll("[data-st]").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-st");
            const i = f.status.indexOf(id);
            if (i >= 0) f.status.splice(i, 1);
            else f.status.push(id);
            if (f.status.includes("ooa")) f.ready = false;
            saveMatch(); renderPartie();
          });
        });
        const rb = card.querySelector("[data-ready]");
        if (rb) rb.addEventListener("click", () => {
          if (f.status.includes("ooa")) return;
          f.ready = !f.ready;
          saveMatch(); renderPartie();
        });
      });
      $("to-post").addEventListener("click", () => { m.phase = "post"; saveMatch(); renderPartie(); });
      $("abort-match").addEventListener("click", () => {
        if (!confirm("Abandonner la partie en cours ?")) return;
        match = null; saveMatch(); setupDraft = newDraft(); renderPartie();
      });
    }

    function postHtml() {
      const m = match;
      const p = m.post || {};
      return `<div class="page">
        <h2>Post-battle</h2>
        <p class="hint">${esc(m.gangs[0].name)} vs ${esc(m.gangs[1].name)} · ${esc(m.edition)} · Round ${m.round}</p>
        <div class="panel"><h3 class="sec">Résultat</h3><div class="body">
          <label class="fld"><span>Vainqueur</span>
            <select id="post-winner">
              <option value="" ${!p.winner ? "selected" : ""}>—</option>
              <option value="${esc(m.gangs[0].name)}" ${p.winner === m.gangs[0].name ? "selected" : ""}>${esc(m.gangs[0].name)}</option>
              <option value="${esc(m.gangs[1].name)}" ${p.winner === m.gangs[1].name ? "selected" : ""}>${esc(m.gangs[1].name)}</option>
              <option value="draw" ${p.winner === "draw" ? "selected" : ""}>Match nul</option>
            </select>
          </label>
          ${m.edition === "N26" ? `
          <label class="fld"><span>Side Job ${esc(m.gangs[0].name)}</span>
            <select id="sj-a"><option value="0" ${!p.sideJobA ? "selected" : ""}>Non</option><option value="1" ${p.sideJobA ? "selected" : ""}>Réussi</option></select>
          </label>
          <label class="fld"><span>Side Job ${esc(m.gangs[1].name)}</span>
            <select id="sj-b"><option value="0" ${!p.sideJobB ? "selected" : ""}>Non</option><option value="1" ${p.sideJobB ? "selected" : ""}>Réussi</option></select>
          </label>` : ""}
          <label class="fld"><span>Crédits ${esc(m.gangs[0].name)}</span><input id="cr-a" value="${esc(p.creditsA || "")}" placeholder="ex. 30 ou 2D3×10"></label>
          <label class="fld"><span>Crédits ${esc(m.gangs[1].name)}</span><input id="cr-b" value="${esc(p.creditsB || "")}" placeholder="ex. 10"></label>
        </div></div>
        <div class="panel"><h3 class="sec">Combattants OOA / notes XP</h3><div class="body">
          ${m.gangs.map((g, gi) => `<div style="margin-bottom:12px"><b style="color:var(--amber)">${esc(g.name)}</b>
            ${g.crew.map(f => `<div class="hint" style="margin:6px 0">${esc(f.name)} — ${f.status.includes("ooa") ? "OOA" : "OK"} · W${f.wounds}${f.status.length ? " · " + f.status.join(", ") : ""}</div>`).join("")}
          </div>`).join("")}
          <label class="fld"><span>Notes (XP, injuries, etc.)</span><textarea id="post-notes" placeholder="Leader A +1 XP, Ganger B lasting injury...">${esc(p.notes || "")}</textarea></label>
        </div></div>
        <button type="button" class="btn primary" id="save-post">Enregistrer et terminer</button>
        <button type="button" class="btn ghost" id="back-live">Retour live</button>
      </div>`;
    }

    function bindPost() {
      const m = match;
      const sync = () => {
        m.post = {
          winner: ($("post-winner") || {}).value || "",
          sideJobA: ($("sj-a") || {}).value === "1",
          sideJobB: ($("sj-b") || {}).value === "1",
          creditsA: ($("cr-a") || {}).value || "",
          creditsB: ($("cr-b") || {}).value || "",
          notes: ($("post-notes") || {}).value || ""
        };
        saveMatch();
      };
      ["post-winner", "sj-a", "sj-b", "cr-a", "cr-b", "post-notes"].forEach(id => {
        const el = $(id); if (el) el.addEventListener("change", sync), el.addEventListener("input", sync);
      });
      $("save-post").addEventListener("click", () => {
        sync();
        m.phase = "done";
        m.endedAt = new Date().toISOString();
        pushHist(m);
        match = null;
        saveMatch();
        setupDraft = newDraft();
        renderPartie();
      });
      $("back-live").addEventListener("click", () => { sync(); m.phase = "live"; saveMatch(); renderPartie(); });
    }

    function renderPartie() {
      match = match || loadMatch();
      const view = $("view");
      if (!match || match.phase === "done" || !match.phase) {
        view.innerHTML = setupHtml();
        bindSetup();
      } else if (match.phase === "live") {
        view.innerHTML = liveHtml();
        bindLive();
      } else if (match.phase === "post") {
        view.innerHTML = postHtml();
        bindPost();
      }
    }

    function route() {
      const h = location.hash.slice(1) || "accueil";
      const back = $("back");
      const title = $("title");
      const view = $("view");
      const homeBtn = $("home-btn");

      const tabs = { accueil: "nav-home", gangs: "nav-gangs", partie: "nav-partie", regles: "nav-regles" };
      Object.values(tabs).forEach(id => { const el = $(id); if (el) el.removeAttribute("aria-current"); });
      if (tabs[h]) $(tabs[h]).setAttribute("aria-current", "page");

      back.hidden = !(h === "soutenir");
      if (homeBtn) homeBtn.hidden = (h === "accueil" || h === "");

      if (h === "gangs") {
        title.textContent = "Gangs";
        view.innerHTML = placeholder("Gangs", "Crée tes gangs, gère tes combattants et leur équipement.");
      } else if (h === "partie") {
        title.textContent = "Partie";
        renderPartie();
      } else if (h === "regles") {
        title.textContent = "Règles";
        view.innerHTML = placeholder("Règles", "Aides de jeu et rappels pour la table.");
      } else if (h === "soutenir") {
        title.textContent = "Soutenir";
        view.innerHTML = supportHtml();
      } else {
        title.textContent = "NecroCounter";
        view.innerHTML = homeHtml();
      }
      window.scrollTo(0, 0);
    }

    $("back").addEventListener("click", () => { location.hash = "accueil"; });
    window.addEventListener("hashchange", route);
    match = loadMatch();
    route();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  })();
  </script>
  <script data-goatcounter="https://necrocounter.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
