    function exportPayload(g) {
      return { format: GANG_FORMAT, version: 1, edition: "N23", gang: { name: g.name, house: g.house, budget: g.budget, fighters: g.fighters, campagne: g.campagne || null } };
    }
    function encodeCode(obj) {
      return "NC1:" + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    }
    function decodeCode(txt) {
      const t = txt.trim();
      if (t.startsWith("NC1:")) return JSON.parse(decodeURIComponent(escape(atob(t.slice(4).replace(/\s+/g, "")))));
      return JSON.parse(t);
    }
    function importGang(obj) {
      const src = obj && obj.format === GANG_FORMAT ? obj.gang : null;
      if (!src || !src.house || !Array.isArray(src.fighters)) throw new Error("Ce n'est pas un gang NecroCounter.");
      if (!HOUSE_NAMES[src.house]) throw new Error("Maison inconnue : " + src.house);
      const g = {
        id: uid(), edition: "N23", name: String(src.name || "Gang importé").slice(0, 80), house: src.house,
        budget: parseInt(src.budget, 10) || 1000,
        fighters: src.fighters.filter(f => f && (f.kind === "brute" || f.kind === "combattant")).map(f => ({
          id: uid(), kind: f.kind, type: String(f.type), name: String(f.name || "").slice(0, 60),
          gear: Array.isArray(f.gear) ? f.gear.map(String) : [], betes: Array.isArray(f.betes) ? f.betes.map(String) : [],
          options: Array.isArray(f.options) ? f.options.map(Number).filter(n => n >= 0) : [],
          skills: Array.isArray(f.skills) ? f.skills.map(String).slice(0, 30) : [],
          xp: Math.max(0, parseInt(f.xp, 10) || 0), recup: !!f.recup, captif: String(f.captif || "").slice(0, 60), spec: !!f.spec,
          adv: Array.isArray(f.adv) ? f.adv.slice(0, 60).map(a => ({ id: String(a.id || ""), stat: a.stat ? String(a.stat) : undefined, skill: a.skill ? String(a.skill) : undefined,
            cr: parseInt(a.cr, 10) || 0, xp: parseInt(a.xp, 10) || 0, label: String(a.label || "").slice(0, 60) })) : [],
          injuries: Array.isArray(f.injuries) ? f.injuries.slice(0, 30).map(i => ({ plage: String(i.plage || ""), nom: String(i.nom || "").slice(0, 60),
            mods: Object.fromEntries(Object.entries(i.mods || {}).filter(([k]) => STAT_KEYS.includes(k)).map(([k, v]) => [k, parseInt(v, 10) || 0])) })) : [],
          ...(f.baseProfil && typeof f.baseProfil === "object" ? { baseProfil: Object.fromEntries(STAT_KEYS.map(k => [k, String(f.baseProfil[k] || "")])), baseCout: parseInt(f.baseCout, 10) || 0, promuDe: String(f.promuDe || "") } : {})
        })),
        campagne: src.campagne && typeof src.campagne === "object" ? { active: !!src.campagne.active, rep: Math.max(1, parseInt(src.campagne.rep, 10) || 1),
          magot: parseInt(src.campagne.magot, 10) || 0, territoires: Array.isArray(src.campagne.territoires) ? src.campagne.territoires.map(String).slice(0, 40) : ["colonie"],
          notes: String(src.campagne.notes || "").slice(0, 2000) } : undefined,
        createdAt: new Date().toISOString()
      };
      return gangData(g.house).then(d => {
        const before = g.fighters.length;
        g.fighters = g.fighters.filter(f => fighterDef(f, d));
        g.fighters.forEach(f => { f.gear = f.gear.filter(id => itemDef(id, d)); f.betes = f.betes.filter(id => beteDef(id, d)); });
        putGang(g);
        return { gang: g, dropped: before - g.fighters.length };
      });
    }
    function downloadFile(name, text) {
      const blob = new Blob([text], { type: "application/json" });
      const u = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 1000);
    }
    function fileSlug(s) {
      return (s || "gang").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase() || "gang";
    }

    document.addEventListener("change", e => {
      const t = e.target;
      if (!gbState || !t.closest || !$("view").contains(t)) return;
      if (t.id === "gb-name") mutateGang(g => { g.name = t.value.trim() || g.name; });
      else if (t.id === "gb-budget") mutateGang(g => { g.budget = Math.max(0, parseInt(t.value, 10) || 0); });
      else if (t.id === "gb-recruit" && t.value) {
        const [k, id] = t.value.split(":");
        mutateGang(g => { const f = { id: uid(), kind: k === "b" ? "brute" : "combattant", type: id, name: "", gear: [], betes: [], options: [] };
          g.fighters.push(f); cpSpend(g, fighterCost(f, gbState.data)); });
      } else if (t.dataset.gbName != null) {
        gbState.gang.fighters[+t.dataset.gbName].name = t.value.trim(); putGang(gbState.gang);
      } else if (t.dataset.gbSkill != null) {
        mutateGang(g => { const f = g.fighters[+t.dataset.gbSkill], rest = (f.skills || []).slice(1); f.skills = t.value ? [t.value].concat(rest.filter(x => x !== t.value)) : rest; });
      } else if (t.dataset.gbGear != null && t.value) {
        mutateGang(g => { g.fighters[+t.dataset.gbGear].gear.push(t.value); cpSpend(g, (itemDef(t.value, gbState.data) || {}).prix || 0); });
      } else if (t.dataset.gbBete != null && t.value) {
        mutateGang(g => { const f = g.fighters[+t.dataset.gbBete]; (f.betes = f.betes || []).push(t.value); cpSpend(g, (beteDef(t.value, gbState.data) || {}).cout || 0); });
      } else if (t.dataset.gbOpt != null) {
        const [fi, oi] = t.dataset.gbOpt.split(":").map(Number);
        mutateGang(g => { const f = g.fighters[fi]; f.options = f.options || []; f.options = t.checked ? [...f.options, oi] : f.options.filter(x => x !== oi);
          const o = ((fighterDef(f, gbState.data) || {}).options || [])[oi]; if (o) cpSpend(g, t.checked ? o.cout : -o.cout); });
      }
      else if (t.id === "cp-addterr" && t.value) mutateGang(g => { g.campagne.territoires = (g.campagne.territoires || []).concat(t.value); });
      else if (t.id === "cp-notes") { gbState.gang.campagne.notes = t.value; putGang(gbState.gang); }
      else if (t.dataset.cpRecup != null) mutateGang(g => { g.fighters[+t.dataset.cpRecup].recup = t.checked; });
      else if (t.dataset.cpSpec != null) mutateGang(g => { g.fighters[+t.dataset.cpSpec].spec = t.checked; });
      else if (t.dataset.cpCaptif != null) mutateGang(g => { g.fighters[+t.dataset.cpCaptif].captif = t.value.trim().slice(0, 60); });
      else if (t.dataset.cpAdv != null && t.value) mutateGang(g => cpAddAdvance(g.fighters[+t.dataset.cpAdv], gbState.data, t.value));
      else if (t.dataset.cpInj != null && t.value) mutateGang(g => {
        const f = g.fighters[+t.dataset.cpInj], b = (gbState.data.refs.blessuresPersistantes || []).find(x => x.plage === t.value); if (!b) return;
        const nom = b.effet.split(" — ")[0];
        if (/Récupération/.test(b.effet)) f.recup = true;
        if (INJ_MODS[b.plage]) (f.injuries = f.injuries || []).push({ plage: b.plage, nom, mods: INJ_MODS[b.plage] });
        let m = `${f.name || "Combattant"} : ${b.effet}.`;
        if (b.plage === "11") { const x = roll(1, 3); f.xp = (f.xp || 0) + x; m += ` +${x} XP ajoutés.`; }
        if (/Mort/.test(b.effet)) m += " Retire-le du gang si personne ne le sauve.";
        gbState.diceMsg = m;
      });
    });

    document.addEventListener("click", e => {
      const t = e.target.closest("button");
      if (!t) return;
      if (t.id === "gb-create") {
        const name = ($("gb-new-name").value || "").trim() || "Mon gang";
        const g = { id: uid(), edition: "N23", name, house: $("gb-new-house").value, budget: parseInt($("gb-new-budget").value, 10) || 1000, fighters: [], createdAt: new Date().toISOString() };
        putGang(g); location.hash = "gangs/n23/gang/" + g.id; return;
      }
      if (t.id === "gb-imp-btn") {
        const file = $("gb-imp-file").files[0], txt = $("gb-imp-text").value;
        const read = file ? file.text() : Promise.resolve(txt);
        read.then(s => importGang(decodeCode(s)))
          .then(r => { location.hash = "gangs/n23/gang/" + r.gang.id; })
          .catch(err => { $("view").innerHTML = importGangHtml("Import impossible : " + (err.message || "format invalide.")); });
        return;
      }
      if (!gbState) return;
      const g = gbState.gang;
      const n = (attr) => t.getAttribute(attr);
      const cpn = n("data-cp-xp") || n("data-cp-unadv") || n("data-cp-uninj") || n("data-cp-gpick");
      if (t.id === "cp-on") return mutateGang(x => { x.campagne = Object.assign({ rep: 1, territoires: ["colonie"], notes: "" }, x.campagne || {}, { active: true });
        if (x.campagne.magot == null) x.campagne.magot = Math.max(0, x.budget - gangCost(x, gbState.data)); });
      if (t.id === "cp-off") { if (confirm("Quitter le mode campagne ? Les données de campagne sont conservées et reviendront si tu le réactives.")) mutateGang(x => { x.campagne.active = false; }); return; }
      if (n("data-cp-rep") != null) return mutateGang(x => { x.campagne.rep = Math.max(1, (x.campagne.rep || 1) + +n("data-cp-rep")); });
      if (n("data-cp-magot") != null) { const v = Math.abs(parseInt(($("cp-amount") || {}).value, 10) || 0); if (v) mutateGang(x => { x.campagne.magot = (x.campagne.magot || 0) + v * +n("data-cp-magot"); }); return; }
      if (n("data-cp-unterr") != null) { e.preventDefault(); return mutateGang(x => { x.campagne.territoires = x.campagne.territoires.filter(i => i !== n("data-cp-unterr")); }); }
      if (n("data-cp-dice") != null) { cpDice(n("data-cp-dice")); const r = $("cp-result"); if (r) r.textContent = gbState.diceMsg; return; }
      if (n("data-cp-promo") != null) return mutateGang(x => cpPromote(x.fighters[+n("data-cp-promo")], gbState.data));
      if (n("data-cp-groll") != null) return mutateGang(x => { const f = x.fighters[+n("data-cp-groll")]; if ((f.xp || 0) < 6) return; f.xp -= 6; f.gangerRoll = roll(2, 6); });
      if (cpn) {
        const [fi, v] = cpn.split(":"); const f = g.fighters[+fi];
        if (n("data-cp-xp") != null) return mutateGang(() => { f.xp = Math.max(0, (f.xp || 0) + +v); });
        if (n("data-cp-uninj") != null) return mutateGang(() => { f.injuries.splice(+v, 1); });
        if (n("data-cp-unadv") != null) return mutateGang(() => {
          const a = f.adv.splice(+v, 1)[0]; if (!a) return;
          f.xp = (f.xp || 0) + (a.xp || 0);
          if (a.skill) f.skills = (f.skills || []).filter(k => k !== a.skill);
          if (a.id === "promo" && f.promuDe) { f.type = f.promuDe; f.spec = true; delete f.promuDe; delete f.baseProfil; delete f.baseCout; }
        });
        if (n("data-cp-gpick") != null) return mutateGang(() => {
          const r = gbState.data.camp.gangers.find(x => f.gangerRoll >= x.de && f.gangerRoll <= x.a); if (!r) return;
          if (v === "spec") f.spec = true;
          else (f.adv = f.adv || []).push({ id: "ganger", stat: v, cr: r.cr, xp: 6, label: "+1 " + v });
          delete f.gangerRoll;
        });
      }
      if (n("data-gb-del") != null) mutateGang(x => x.fighters.splice(+n("data-gb-del"), 1));
      else if (n("data-gb-dup") != null) mutateGang(x => { const f = x.fighters[+n("data-gb-dup")]; x.fighters.splice(+n("data-gb-dup") + 1, 0, { ...JSON.parse(JSON.stringify(f)), id: uid(), name: f.name ? f.name + " bis" : "" }); });
      else if (n("data-gb-up") != null) mutateGang(x => { const i = +n("data-gb-up"); if (i > 0) [x.fighters[i - 1], x.fighters[i]] = [x.fighters[i], x.fighters[i - 1]]; });
      else if (n("data-gb-ungear") != null) { const [fi, gi] = n("data-gb-ungear").split(":").map(Number); mutateGang(x => { const id = x.fighters[fi].gear.splice(gi, 1)[0]; cpSpend(x, -((itemDef(id, gbState.data) || {}).prix || 0)); }); }
      else if (n("data-gb-unbete") != null) { const [fi, bi] = n("data-gb-unbete").split(":").map(Number); mutateGang(x => { const id = x.fighters[fi].betes.splice(bi, 1)[0]; cpSpend(x, -((beteDef(id, gbState.data) || {}).cout || 0)); }); }
      else if (t.id === "gb-export-file") downloadFile(fileSlug(g.name) + ".necrocounter.json", JSON.stringify(exportPayload(g), null, 2));
      else if (t.id === "gb-export-code") {
        const code = encodeCode(exportPayload(g)), msg = $("gb-share-msg");
        const done = ok => { msg.textContent = ok ? "Code copié : envoie-le à ton adversaire, il pourra l'importer." : "Copie impossible : sélectionne le code ci-dessous."; if (!ok) msg.innerHTML += `<textarea class="gb-code" readonly>${esc(code)}</textarea>`; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => done(true), () => done(false)); else done(false);
      } else if (t.id === "gb-delete" && confirm(`Supprimer le gang « ${g.name} » ?`)) {
        saveGangs(loadGangs().filter(x => x.id !== g.id)); gbState = null; location.hash = "gangs/n23";
      }
    });

    // Pour l'onglet Partie : transforme un gang créé en équipe de partie
    // Fiche complète d'un combattant pour la Partie (profil, armes, équipement, compétences, règles)
    function weaponSheet(w, modes) {
      return { nom: w.nom, profils: w.profils.filter(p => !modes || !p.mode || modes.includes(p.mode)) };
    }
    function skillInfo(name, d) {
      for (const L of Object.values(d.refs.competences || {})) { const x = L.find(k => k.nom.toLowerCase() === String(name).toLowerCase()); if (x) return { nom: x.nom, resume: x.resume }; }
      return { nom: name, resume: "" };
    }
    function buildSheet(f, d) {
      const def = fighterDef(f, d);
      if (!def) return null;
      const byId = Object.fromEntries(d.armes.armes.map(a => [a.id, a]));
      if (f.kind === "brute") {
        const chosen = (f.options || []).map(i => (def.options || [])[i]).filter(Boolean).map(o => o.nom);
        const txt = (def.equipement + " " + chosen.join(" ")).toLowerCase();
        const weapons = (def.armes || []).map(id => byId[id]).filter(Boolean)
          .filter(w => txt.includes(w.nom.split(" (")[0].toLowerCase()) || txt.includes(w.nom.split(" (")[0].toLowerCase().replace(/s$/, "")));
        return { role: def.nom, profil: def.profil,
          weapons: (weapons.length ? weapons : (def.armes || []).map(id => byId[id]).filter(Boolean)).map(w => weaponSheet(w)),
          gear: [def.equipement].concat(chosen.map(c => "Option : " + c)),
          skills: (def.competencesDepart || []).map(n => skillInfo(n, d)),
          regles: def.regles || [] };
      }
      const items = (f.gear || []).map(id => itemDef(id, d)).filter(Boolean);
      return { role: isSpecialist(f) ? "Spécialiste" : def.role, profil: effProfil(f, d),
        weapons: items.filter(i => i.arme && byId[i.arme]).map(i => weaponSheet(byId[i.arme], i.modes)),
        gear: def.equipementDeDepart.concat(items.filter(i => !(i.arme && byId[i.arme])).map(i => i.nom)),
        skills: (f.skills || []).map(n => skillInfo(n, d)), regles: [] };
    }
    function beastSheet(id, owner, d) {
      const b = beteDef(id, d); if (!b) return null;
      const byId = Object.fromEntries(d.armes.armes.map(a => [a.id, a]));
      return { role: b.nom + " (Bête de " + owner + ")", profil: b.profil, weapons: (b.armes || []).map(x => byId[x]).filter(Boolean).map(w => weaponSheet(w)),
        gear: [], skills: [], regles: b.regles || [] };
    }

    // Pour l'onglet Partie : transforme un gang créé en équipe de partie
    function gangForMatch(id) {
      const g = getGang(id);
      if (!g) return Promise.resolve(null);
      return gangData(g.house).then(d => {
        const crew = [];
        g.fighters.forEach(f => {
          if (inCamp(g) && (f.recup || f.captif)) return;
          const def = fighterDef(f, d);
          const label = def ? (f.kind === "brute" ? def.nom : isSpecialist(f) ? "Spécialiste" : def.role) : "Combattant";
          const pv = def ? parseInt((effProfil(f, d) || def.profil).PV, 10) || 1 : 1;
          const name = f.name ? `${f.name} (${label})` : label;
          crew.push({ id: uid(), name, cost: fighterCost(f, d), wounds: pv, maxWounds: pv, ready: true, status: [], sheet: buildSheet(f, d) });
          (f.betes || []).forEach(bid => {
            const sh = beastSheet(bid, f.name || label, d); if (!sh) return;
            const bpv = parseInt(sh.profil.PV, 10) || 1;
            crew.push({ id: uid(), name: sh.role, cost: 0, wounds: bpv, maxWounds: bpv, ready: true, status: [], sheet: sh });
          });
        });
        return { name: g.name, rating: String(gangCost(g, d)), crew };
      });
    }

    function route() {
      gbState = null;
      const h = location.hash.slice(1) || "accueil";
      const parts = h.split("/");
      const section = parts[0];
      let edition = EDITIONS[parts[1]] ? parts[1] : null;
      const house = edition ? parts[2] : parts[1];   // ancien lien #gangs/goliath = N23
      if (!edition) edition = house ? "n23" : storedEdition();
      if (section === "gangs" || section === "regles") saveEdition(edition);
      const back = $("back");
      const title = $("title");
      const view = $("view");

      const tabs = { gangs: "nav-gangs", partie: "nav-partie", regles: "nav-regles" };
      Object.values(tabs).forEach(id => { const el = $(id); if (el) el.removeAttribute("aria-current"); });
      if (tabs[section]) $(tabs[section]).setAttribute("aria-current", "page");

      back.hidden = !(h === "soutenir" || h === "installer" || h === "compte" || h === "carte" || h === "confidentialite" || (section === "gangs" && house));
      const homeBtn = $("home-btn");
      if (homeBtn) homeBtn.hidden = (h === "accueil" || h === "");
      if (section === "gangs" && edition === "n23" && house === "creer") {
        title.textContent = "Gangs";
        showAsync(view, load("index.json"), createGangHtml);
      } else if (section === "gangs" && edition === "n23" && house === "importer") {
        title.textContent = "Gangs";
        view.innerHTML = importGangHtml();
      } else if (section === "gangs" && edition === "n23" && house === "gang") {
        title.textContent = "Gangs";
        const g = getGang(parts[3]);
        if (!g) view.innerHTML = `<div class="page"><div class="placeholder">Gang introuvable sur cet appareil.</div></div>`;
        else showAsync(view, gangData(g.house), d => { gbState = { gang: g, data: d }; return gangEditorHtml(g, d); });
      } else if (section === "gangs" && edition === "n23" && house && ACTIVE_HOUSES.includes(house)) {
        title.textContent = "Gangs";
        showAsync(view, Promise.all([load("maisons/" + house + ".json"), load("armes.json"), load("mercenaires.json")]), ([data, armes, mercs]) => houseHtml(data, armes, mercs));
      } else if (section === "gangs" && edition === "n23" && house === "mercenaires") {
        title.textContent = "Gangs";
        showAsync(view, Promise.all([load("mercenaires.json"), load("armes.json")]), mercenariesHtml);
      } else if (section === "gangs" && edition === "n26") {
        title.textContent = "Gangs";
        view.innerHTML = comingSoonHtml("Gangs", "gangs", "Les listes de gangs de Necromunda N26 arriveront ici.");
      } else if (section === "gangs") {
        title.textContent = "Gangs";
        showAsync(view, load("index.json"), housesHtml);
      } else if (h === "aide") {
        title.textContent = "Aperçu";
        const m = match || loadMatch();
        const fromPartie = !!(m && m.phase && m.phase !== "done");
        const from = fromPartie ? "partie" : (sessionStorage.getItem("nc_aide_from") || "accueil");
        view.innerHTML = aideHtml(from === "regles" ? "regles" : (from === "partie" ? "partie" : "accueil"));
        back.hidden = false;
      } else if (h === "partie") {
        title.textContent = "Partie";
        sessionStorage.setItem("nc_aide_from", "partie");
        renderPartie();
      } else if (section === "regles" && edition === "n26") {
        title.textContent = "Règles";
        sessionStorage.setItem("nc_aide_from", "regles");
        view.innerHTML = comingSoonHtml("Règles", "regles", "Les règles de Necromunda N26 arriveront ici.");
      } else if (section === "regles") {
        title.textContent = "Règles";
        sessionStorage.setItem("nc_aide_from", "regles");
        showAsync(view, Promise.all([load("armes.json"), load("comptoir.json"), load("refs.json"), load("campagne.json"), load("scenarios.json")]), armouryHtml);
      } else if (h === "compte" || h === "carte" || h === "confidentialite") {
        title.textContent = { compte: "Mon compte", carte: "Carte des joueurs", confidentialite: "Confidentialité" }[h];
        if (window.NC_COMPTE) window.NC_COMPTE.open(h);
        else view.innerHTML = `<div class="page"><div class="placeholder">Compte indisponible : recharge la page.</div></div>`;
      } else if (h === "installer") {
        title.textContent = "Installer";
        view.innerHTML = installHtml();
      } else if (h === "soutenir") {
        title.textContent = "Soutenir";
        view.innerHTML = supportHtml();
      } else {
        title.textContent = "NecroCounter";
        sessionStorage.setItem("nc_aide_from", "accueil");
        view.innerHTML = homeHtml();
      }
      window.scrollTo(0, 0);
    }

    $("back").addEventListener("click", () => {
      const hh = location.hash.slice(1);
      if (hh === "aide") {
        const m = match || loadMatch();
        if (m && m.phase && m.phase !== "done") location.hash = "partie";
        else location.hash = sessionStorage.getItem("nc_aide_from") || "accueil";
      } else {
        location.hash = location.hash.startsWith("#gangs/") ? "gangs/n23" : "accueil";
      }
    });
    window.addEventListener("hashchange", route);
    route();

    // Écran de chargement : le N tourne au moins un tour, puis s'efface
    (function () {
      const splash = $("splash"), start = Date.now(), MIN = 1400;
      let hidden = false;
      const hide = () => {
        if (hidden) return; hidden = true;
        setTimeout(() => {
          splash.classList.add("done");
          setTimeout(() => splash.remove(), 400);
        }, Math.max(0, MIN - (Date.now() - start)));
      };
      if (document.readyState === "complete") hide(); else window.addEventListener("load", hide);
      setTimeout(hide, 5000);
    })();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  })();
  </script>
<script data-goatcounter="https://necrocounter.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
